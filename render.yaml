services:
  - type: web
    name: diaria-ai
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://diaria-ai.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://diaria-ai.onrender.com
